    <script>
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
        }
        
        function setCookie(name, value, days = 365) {
            const expires = new Date(Date.now() + days*24*60*60*1000).toUTCString();
            document.cookie = `${name}=${value}; expires=${expires}; path=/`;
        }
        
        function prefersDarkMode() {
            return window.matchMedia("(prefers-color-scheme: dark)").matches;
        }
        
        function applyTheme(theme) {
            const root = document.getElementById("root-container");
            if (!root) return;
        
            const shouldBeDark = theme === "dark" || (theme === "system" && prefersDarkMode());
            root.classList.toggle("dark", shouldBeDark);
            setCookie("theme", theme);
        
            updateButtonIcon(shouldBeDark);
        }
        
        function updateButtonIcon(isDark) {
            const buttonSpan = document.querySelector('button[aria-label="Cambiar tema"] span');
            if (!buttonSpan) return;
        
            buttonSpan.innerHTML = isDark
                ? `
                <svg class="size-4" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2" />
                    <path d="M12 2v2" stroke="currentColor" stroke-width="2" />
                    <path d="M12 20v2" stroke="currentColor" stroke-width="2" />
                    <path d="M2 12h2" stroke="currentColor" stroke-width="2" />
                    <path d="M20 12h2" stroke="currentColor" stroke-width="2" />
                    <path d="m4.93 4.93 1.41 1.41" stroke="currentColor" stroke-width="2" />
                    <path d="m17.66 17.66 1.41 1.41" stroke="currentColor" stroke-width="2" />
                    <path d="m6.34 17.66-1.41 1.41" stroke="currentColor" stroke-width="2" />
                    <path d="m19.07 4.93-1.41 1.41" stroke="currentColor" stroke-width="2" />
                </svg>
                `
                : `
                <svg class="size-4" viewBox="0 0 24 24" fill="none">
                    <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                `;
        }
        
        function initializeTheme() {
            let theme = getCookie('theme') || 'system';  // Default to system
            applyTheme(theme);
        
            // If theme is system, listen to system changes
            if (theme === "system") {
                window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
                    applyTheme('system');
                });
            }
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            initializeTheme();
        
            const themeToggleButton = document.querySelector('button[aria-label="Cambiar tema"]');
            if (themeToggleButton) {
                themeToggleButton.addEventListener('click', () => {
                    let currentTheme = getCookie('theme') || 'system';
        
                    let newTheme;
                    if (currentTheme === "light") {
                        newTheme = "dark";
                    } else if (currentTheme === "dark") {
                        newTheme = "system"; // After dark → system
                    } else {
                        newTheme = "light"; // After system → light
                    }
        
                    applyTheme(newTheme);
                });
            }
        });
    </script>
</head>
